    a[0].name=word+'연휴';
    a[Math.floor(a.length/2)].name=word;
    a[a.length-1].name=word+'연휴';
  }
}
function applyHolidayEntries(year,entries){
  Object.keys(holidayMap).filter(k=>k.startsWith(year+'-')).forEach(k=>delete holidayMap[k]);
  entries.forEach(x=>{if(x.date&&x.name)holidayMap[x.date]=x.name});
}
function loadHolidayScript(){
  if(window.Holidays)return Promise.resolve();
  if(window.__holidayScriptPromise)return window.__holidayScriptPromise;
  window.__holidayScriptPromise=new Promise((resolve,reject)=>{
    let s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/date-holidays@3/dist/umd.min.js';
    s.async=true;s.onload=resolve;s.onerror=()=>reject(Error('공휴일 라이브러리 로드 실패'));
    document.head.appendChild(s);
  });
  return window.__holidayScriptPromise;
}
async function ensureHolidayYear(year){
  if(holidayLoadPromises[year])return holidayLoadPromises[year];
  holidayLoadPromises[year]=(async()=>{
    if(OFFICIAL_HOLIDAY_OVERRIDES[year]){
      const entries=Object.entries(OFFICIAL_HOLIDAY_OVERRIDES[year]).map(([date,name])=>({date,name,substitute:name.includes('대체공휴일')}));
      applyHolidayEntries(year,entries);
      return true;
    }
    const key='chaltteoklog.kr-holidays.'+year+'.v4';
    try{
      let cached=JSON.parse(localStorage.getItem(key)||'null');
      if(cached?.savedAt&&Date.now()-cached.savedAt<HOLIDAY_CACHE_DAYS*864e5&&Array.isArray(cached.entries)){
        applyHolidayEntries(year,cached.entries);return true;
      }
    }catch{}
    try{
      await loadHolidayScript();
      const HD=window.Holidays?.default||window.Holidays;
      if(!HD)throw Error('Holidays 객체 없음');
      const hd=new HD('KR');
      try{hd.setLanguages('ko')}catch{}
      let entries=hd.getHolidays(year).filter(h=>h.type==='public').map(h=>({
        date:String(h.date||'').slice(0,10),
        name:normalizeHolidayName(h.name,h.substitute),
        substitute:!!h.substitute
      })).filter(x=>x.date&&x.name);
      polishThreeDayHoliday(entries,'설날');
      polishThreeDayHoliday(entries,'추석');
      if(!entries.length)throw Error('공휴일 데이터 없음');
      applyHolidayEntries(year,entries);
      try{localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),entries}))}catch{}
      return true;
    }catch(e){
      console.warn('공휴일 자동 갱신 실패, 내장 데이터 사용:',e);
      return false;
    }
  })();
  return holidayLoadPromises[year];
}

async function loadSch(){if(!baby)return;let r=await db.from('schedules').select('*').eq('baby_id',baby.id).order('due_date');if(r.error)return alert('일정 불러오기 실패: '+r.error.message);schedules=r.data||[];if(!selectedDate)selectedDate=ymd(new Date());renderCal();await ensureHolidayYear(calDate.getFullYear());renderCal()}
