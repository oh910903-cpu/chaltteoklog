<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>찰떡이로그</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
:root{--p:#f06f9c;--b:#fff7fa;--m:#8d858b;--l:#eee3e8}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:-apple-system,"Noto Sans KR",sans-serif;color:#29262b}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding:18px 16px 78px}.hide{display:none!important}.brand{font-size:26px;font-weight:900}.pink{color:var(--p)}.sub,.meta{color:var(--m);font-size:13px}.card{border:1px solid var(--l);border-radius:18px;padding:15px;margin:12px 0}.hero{display:flex;justify-content:space-between;align-items:center;background:#fff7fa}.hero b{color:var(--p)}button,input,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.pri{background:var(--p);color:#fff}.sec{background:#f6f1f3}.danger{color:#c43f58}.field{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;margin:6px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick{grid-template-columns:repeat(4,1fr)}.q{background:white;border:1px solid var(--l);border-radius:14px;padding:12px 4px}.sum{background:#fff0f5;border-radius:14px;padding:12px}.sum b{display:block;font-size:18px}.log{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--l)}.screen{display:none}.screen.on{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--l);padding:8px}.nav button{border:0;background:none;color:#999}.nav .on{color:var(--p);font-weight:900}.modal{position:fixed;inset:0;background:#0004;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.barbox{height:170px;display:flex;align-items:flex-end;gap:6px;overflow-x:auto;border-bottom:1px solid #ddd}.bar{min-width:24px;background:#f59abd;border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:100%;font-size:9px;white-space:nowrap}.login{padding-top:70px}#age{font-size:20px!important;font-weight:800!important}
.calendar{padding:14px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-title{font-size:18px;font-weight:900}.cal-nav{border:0;background:#f6f1f3;border-radius:10px;width:36px;height:34px;font-size:18px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-dow{text-align:center;font-size:11px;color:#999;padding:4px 0 7px}.cal-day{position:relative;border:0;background:#fff;border-radius:11px;min-height:43px;padding:6px 2px;font-size:13px;color:#29262b}.cal-day.other{color:#c8c2c6}.cal-day.today{background:#fff0f5;font-weight:900}.cal-day.selected{background:var(--p);color:#fff;font-weight:900}.cal-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--p)}.cal-day.selected .cal-dot{background:#fff}.day-events{margin-top:10px}.event-item{padding:11px 2px;border-bottom:1px solid var(--l)}.event-item:last-child{border-bottom:0}.event-date{font-size:15px;font-weight:900;margin-bottom:4px}.event-actions{display:flex;gap:7px;margin-top:8px}.event-actions button{border:0;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;background:#f6f1f3;color:#555}.event-actions .danger{color:#b6425d}.schedule-form-title{margin:20px 0 6px}</style></head><body><div class="app">
<div id="login" class="login"><div class="brand">찰떡이<span class="pink">로그</span> ♥</div><p class="sub">오늘도 찰떡이의 하루를 차곡차곡 기록해요</p><input id="uid" class="field" placeholder="아이디"><input id="pw" class="field" type="password" placeholder="비밀번호"><button id="loginBtn" class="btn pri" style="width:100%" onclick="login()">로그인</button><div id="msg" class="meta"></div></div>

<section id="home" class="screen on"><div class="card hero"><div><div class="meta">우리 아기</div><div id="age" class="meta"></div></div><div>오늘도<br><b>잘 자라고 있어요 <span style="color:#29262b">♥</span></b></div></div><div class="card" style="text-align:center;padding:18px 16px;margin-top:12px;background:#fff8fa"><div style="font-size:22px;font-weight:900;color:#29262b;margin-bottom:7px">오하늬</div><div style="font-size:13px;color:#777;margin-bottom:7px">이름에 담은 마음</div><div style="font-size:14px;line-height:1.65;color:#3b363b;font-weight:600">“바람처럼 자유롭고 건강하게<br>자신의 길을 걸어가는 아이”</div></div><h3>오늘 기록하기</h3><div class="grid quick"><button class="q" onclick="openRec('feed')">🍼<br>수유</button><button class="q" onclick="openRec('sleep')">🌙<br>수면</button><button class="q" onclick="openRec('pee')">💧<br>소변</button><button class="q" onclick="openRec('poo')">💩<br>대변</button></div><h3>오늘의 요약 <button class="btn sec danger" onclick="resetToday()">초기화</button></h3><div id="summary" class="grid"></div><h3>최근 기록</h3><div id="recent" class="card"></div></section>

<section id="schedule" class="screen"><h3>일정</h3><div class="card calendar"><div class="cal-head"><button class="cal-nav" onclick="moveCal(-1)" aria-label="이전 달">‹</button><div id="calTitle" class="cal-title"></div><button class="cal-nav" onclick="moveCal(1)" aria-label="다음 달">›</button></div><div id="calGrid" class="cal-grid"></div><div id="dayEvents" class="day-events"></div></div><h3 id="scheduleFormTitle" class="schedule-form-title">일정 작성</h3><div class="card"><input id="st" class="field" placeholder="일정 제목"><input id="sd" class="field" type="date"><textarea id="sn" class="field" placeholder="메모"></textarea><button id="scheduleSaveBtn" class="btn pri" onclick="saveSch()">일정 추가</button><button id="scheduleCancelBtn" class="btn" style="display:none;margin-top:8px" onclick="cancelSchEdit()">수정 취소</button></div></section>
<section id="growth" class="screen"><h3>성장</h3><div id="grow" class="card"></div></section>
<section id="more" class="screen"><h3>더보기</h3><div class="card"><div id="fam" class="meta"></div><div id="babyinfo" class="meta"></div><button class="btn sec" onclick="logout()">로그아웃</button></div></section>
<nav class="nav"><button class="on" onclick="tab('home',this)">🏠<br>홈</button><button onclick="tab('record',this)">📝<br>기록</button><button onclick="tab('schedule',this)">📅<br>일정</button><button onclick="tab('growth',this)">📈<br>성장</button><button onclick="tab('more',this)">•••<br>더보기</button></nav></div></div>
<div id="recModal" class="modal hide"><div class="sheet"><h3 id="rt"></h3><div id="rf"></div><button class="btn sec" onclick="closeM('recModal')">취소</button> <button class="btn pri" onclick="saveRec()">저장</button></div></div>
<div id="detail" class="modal hide"><div class="sheet"><h3 id="dt"></h3><button class="btn pri" onclick="addDetail()" id="addBtn">+ 새 기록 추가</button><div id="chart"></div><div id="list"></div><button class="btn sec" onclick="closeM('detail')">닫기</button></div></div>
<script>
const U='https://hsicozbewmeplmcmxkxk.supabase.co',K='sb_publishable_ewvwyonvphgV5fRlYogqoQ_7h5QqQZY',db=supabase.createClient(U,K),$=x=>document.getElementById(x);let user,baby,family,logs=[],schedules=[],type='',edit=null,calDate=new Date(),selectedDate='',editingScheduleId=null;const L={feed:'🍼 수유',sleep:'🌙 수면',pee:'💧 소변',poo:'💩 대변',weight:'⚖️ 체중',temperature:'🌡️ 체온',note:'📝 건강메모'};
async function hashEmail(n){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.trim().normalize('NFC').toLowerCase()));return'u_'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)+'@babyflow.example'}
async function login(){let b=$('loginBtn');try{b.disabled=1;b.textContent='로그인 중...';$('msg').textContent='';let n=$('uid').value.trim(),p=$('pw').value;if(!n||!p)throw Error('아이디와 비밀번호를 입력해주세요.');let email;try{let r=await db.functions.invoke('resolve-username',{body:{username:n}});if(r.error||!r.data?.email)throw r.error||Error('resolve');email=r.data.email}catch{email=await hashEmail(n)}let r=await db.auth.signInWithPassword({email,password:p});if(r.error)throw r.error;await init()}catch(e){$('msg').textContent=(e.message||'로그인 오류').includes('Invalid login')?'아이디 또는 비밀번호를 확인해주세요.':'로그인 실패: '+(e.message||e)}finally{b.disabled=0;b.textContent='로그인'}}
async function init(){let s=(await db.auth.getSession()).data.session;if(!s)return;user=s.user;let m=(await db.from('family_members').select('family_id').eq('user_id',user.id).single()).data;if(!m)return;$('login').classList.add('hide');$('main').classList.remove('hide');family=(await db.from('families').select('*').eq('id',m.family_id).single()).data;baby=(await db.from('babies').select('*').eq('family_id',m.family_id).single()).data;age();$('fam').textContent=(family?.name||'우리 가족')+' · 초대코드 '+(family?.invite_code||'-');$('babyinfo').textContent=(baby?.name||'')+' · '+(baby?.birth_date||'');await load();await loadSch()}
function age(){let [y,m,d]=(baby.birth_date||baby.due_date).split('-').map(Number),a=new Date(y,m-1,d),t=new Date();t.setHours(0,0,0,0);let z=Math.floor((t-a)/864e5);$('age').textContent=z>=0?`D+${z+1} · 생후 ${z+1}일째`:`출산까지 D-${-z}`}
async function load(){let r=await db.from('baby_logs').select('*').eq('baby_id',baby.id).order('started_at',{ascending:false}).limit(400);if(r.error)return alert(r.error.message);logs=r.data||[];render()}
function today(){let a=new Date();a.setHours(0,0,0,0);let b=new Date(a);b.setDate(b.getDate()+1);return[a,b]}
function render(){let[a,b]=today(),t=logs.filter(x=>{let d=new Date(x.started_at);return d>=a&&d<b}),f=t.filter(x=>x.log_type==='feed'),s=t.filter(x=>x.log_type==='sleep'),p=t.filter(x=>x.log_type==='pee'),q=t.filter(x=>x.log_type==='poo'),ml=f.reduce((n,x)=>n+(+x.value_numeric||0),0),mn=s.reduce((n,x)=>n+(x.ended_at?(new Date(x.ended_at)-new Date(x.started_at))/6e4:0),0);$('summary').innerHTML=`<div class="sum">수유<b>${f.length}회 · ${ml}mL</b></div><div class="sum">수면<b>${s.length}회 · ${(mn/60).toFixed(1)}시간</b></div><div class="sum">소변<b>${p.length}회</b></div><div class="sum">대변<b>${q.length}회</b></div>`;$('recent').innerHTML=logs.slice(0,8).map(x=>row(x,0)).join('')||'기록이 없습니다.';$('types').innerHTML=Object.keys(L).map(k=>`<button class="q" onclick="openDetail('${k}')">${L[k]}</button>`).join('');let w=logs.find(x=>x.log_type==='weight'),c=logs.find(x=>x.log_type==='temperature');$('grow').innerHTML=`최근 체중: ${w?.value_numeric??'-'} kg<br>최근 체온: ${c?.value_numeric??'-'} ℃`}
function val(x){if(x.log_type==='feed')return(x.value_numeric||0)+'mL';if(x.log_type==='weight')return x.value_numeric+'kg';if(x.log_type==='temperature')return x.value_numeric+'℃';if(x.log_type==='sleep'&&x.ended_at)return Math.round((new Date(x.ended_at)-new Date(x.started_at))/6e4)+'분';return x.value_text||''}function row(x,btn=1){return`<div class="log"><div><b>${L[x.log_type]} ${val(x)}</b><div class="meta">${new Date(x.started_at).toLocaleString('ko-KR')}</div></div>${btn?`<div><button class="btn sec" onclick="editRec('${x.id}')">수정</button><button class="btn sec danger" onclick="delRec('${x.id}')">삭제</button></div>`:''}</div>`}
function local(v){let d=v?new Date(v):new Date(),z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,16)}function openRec(k,x=null){type=k;edit=x?.id||null;$('rt').textContent=(edit?'기록 수정 · ':'')+L[k];let t=local(x?.started_at),h='';if(['feed','weight','temperature'].includes(k))h=`<input id="num" class="field" type="number" step="0.1" placeholder="${k==='feed'?'수유량(mL)':k==='weight'?'체중(kg)':'체온(℃)'}" value="${x?.value_numeric??''}">`;if(k==='sleep')h+=`<input id="end" class="field" type="datetime-local" value="${x?.ended_at?local(x.ended_at):''}">`;h+=`<textarea id="txt" class="field" placeholder="메모">${x?.value_text||''}</textarea><input id="start" class="field" type="datetime-local" value="${t}">`;$('rf').innerHTML=h;$('recModal').classList.remove('hide')}
async function saveRec(){try{let x=logs.find(v=>v.id===edit),p={baby_id:baby.id,user_id:x?.user_id||user.id,log_type:type,started_at:new Date($('start').value).toISOString(),ended_at:null,value_numeric:null,value_text:$('txt').value.trim()||null};if(['feed','weight','temperature'].includes(type))p.value_numeric=+$('num').value;if(type==='sleep'&&$('end').value)p.ended_at=new Date($('end').value).toISOString();let r=edit?await db.from('baby_logs').update(p).eq('id',edit):await db.from('baby_logs').insert(p);if(r.error)throw r.error;closeM('recModal');edit=null;await load();if(!$('detail').classList.contains('hide'))openDetail(type)}catch(e){alert('저장 실패: '+e.message)}}function editRec(id){let x=logs.find(v=>v.id===id);closeM('detail');openRec(x.log_type,x)}async function delRec(id){if(!confirm('삭제할까요?'))return;let r=await db.from('baby_logs').delete().eq('id',id);if(r.error)return alert(r.error.message);await load();openDetail(type)}
function openDetail(k){type=k;$('dt').textContent=L[k]+' 기록';$('addBtn').textContent=k==='note'?'+ 건강메모 추가':'+ 새 기록 추가';let a=logs.filter(x=>x.log_type===k).slice(0,30);$('list').innerHTML=a.map(x=>row(x,1)).join('')||'기록이 없습니다.';$('chart').innerHTML=k==='note'?'':chart(a);$('detail').classList.remove('hide')}function addDetail(){closeM('detail');openRec(type)}function chart(a){if(!a.length)return'';let v=a.map(x=>type==='sleep'&&x.ended_at?(new Date(x.ended_at)-new Date(x.started_at))/6e4:+x.value_numeric||1).reverse(),m=Math.max(...v,1);return`<div class="barbox">${v.map((n,i)=>`<div class="bar" style="height:${Math.max(8,n/m*130)}px"><span>${Math.round(n*10)/10}</span></div>`).join('')}</div>`}
async function resetToday(){if(!confirm('오늘 기록을 모두 삭제할까요?'))return;let[a,b]=today();await db.from('baby_logs').delete().eq('baby_id',baby.id).gte('started_at',a.toISOString()).lt('started_at',b.toISOString());await load()}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function saveSch(){let title=$('st').value.trim(),due=$('sd').value,note=$('sn').value.trim()||null;if(!title||!due)return alert('일정 제목과 날짜를 입력해주세요.');let r;if(editingScheduleId){r=await db.from('schedules').update({title,due_date:due,note}).eq('id',editingScheduleId).eq('baby_id',baby.id).select().single();}else{r=await db.from('schedules').insert({baby_id:baby.id,user_id:user.id,title,due_date:due,note,category:'general'}).select().single();}if(r.error)return alert((editingScheduleId?'일정 수정 실패: ':'일정 저장 실패: ')+r.error.message);selectedDate=due;let d=new Date(due+'T00:00:00');calDate=new Date(d.getFullYear(),d.getMonth(),1);cancelSchEdit(false);await loadSch();}
function editSch(id){let x=schedules.find(v=>v.id===id);if(!x)return;editingScheduleId=id;$('st').value=x.title||'';$('sd').value=x.due_date||'';$('sn').value=x.note||'';$('scheduleFormTitle').textContent='일정 수정';$('scheduleSaveBtn').textContent='수정 저장';$('scheduleCancelBtn').style.display='block';$('st').focus();$('scheduleFormTitle').scrollIntoView({behavior:'smooth',block:'start'});}
function cancelSchEdit(clear=true){editingScheduleId=null;$('scheduleFormTitle').textContent='일정 작성';$('scheduleSaveBtn').textContent='일정 추가';$('scheduleCancelBtn').style.display='none';$('st').value='';$('sn').value='';}
async function deleteSch(id){let x=schedules.find(v=>v.id===id);if(!x||!confirm(`"${x.title}" 일정을 삭제할까요?`))return;let r=await db.from('schedules').delete().eq('id',id).eq('baby_id',baby.id);if(r.error)return alert('일정 삭제 실패: '+r.error.message);if(editingScheduleId===id)cancelSchEdit();await loadSch();}
async function loadSch(){if(!baby)return;let r=await db.from('schedules').select('*').eq('baby_id',baby.id).order('due_date');if(r.error)return alert('일정 불러오기 실패: '+r.error.message);schedules=r.data||[];if(!selectedDate)selectedDate=ymd(new Date());renderCal()}
function moveCal(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCal()}
function selectDay(ds){selectedDate=ds;$('sd').value=ds;let d=new Date(ds+'T00:00:00');calDate=new Date(d.getFullYear(),d.getMonth(),1);renderCal()}
function renderCal(){if(!$('calGrid'))return;let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=ymd(new Date());$('calTitle').textContent=`${y}년 ${m+1}월`;let html=['일','월','화','수','목','금','토'].map(x=>`<div class="cal-dow">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=ymd(d),has=schedules.some(x=>x.due_date===ds),cls=['cal-day'];if(d.getMonth()!==m)cls.push('other');if(ds===today)cls.push('today');if(ds===selectedDate)cls.push('selected');html+=`<button class="${cls.join(' ')}" onclick="selectDay('${ds}')">${d.getDate()}${has?'<span class="cal-dot"></span>':''}</button>`}$('calGrid').innerHTML=html;renderDayEvents()}
function renderDayEvents(){let a=schedules.filter(x=>x.due_date===selectedDate),d=selectedDate?new Date(selectedDate+'T00:00:00'):new Date(),label=`${d.getMonth()+1}월 ${d.getDate()}일 일정`;$('dayEvents').innerHTML=`<div class="event-date">${label}</div>`+(a.length?a.map(x=>`<div class="event-item"><b>${esc(x.title)}</b>${x.note?`<div class="meta" style="margin-top:4px">${esc(x.note)}</div>`:''}<div class="event-actions"><button onclick="editSch('${x.id}')">수정</button><button class="danger" onclick="deleteSch('${x.id}')">삭제</button></div></div>`).join(''):'<div class="meta">등록된 일정이 없습니다.</div>')}
function tab(n,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(n).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function closeM(id){$(id).classList.add('hide')}async function logout(){await db.auth.signOut();location.reload()}init();</script></body></html>
